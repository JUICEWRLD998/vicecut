<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Container port at 03:07 — stacked containers under a hard security flood, deep shadow between the rows, a CCTV camera in the foreground">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070C"/>
      <stop offset="0.5" stop-color="#0A0E16"/>
      <stop offset="0.82" stop-color="#141C26"/>
      <stop offset="1" stop-color="#1D2733"/>
    </linearGradient>

    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B232C"/>
      <stop offset="0.3" stop-color="#111820"/>
      <stop offset="0.7" stop-color="#080C12"/>
      <stop offset="1" stop-color="#04060A"/>
    </linearGradient>

    <radialGradient id="floodCool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#CFE6F2" stop-opacity="0.5"/>
      <stop offset="0.3" stop-color="#9FC4D8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6E94AC" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="floodWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC98A" stop-opacity="0.42"/>
      <stop offset="0.34" stop-color="#FFB35C" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#E08A2E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="floodCone" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#CFE6F2" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#9FC4D8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#9FC4D8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="containerA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3642"/>
      <stop offset="0.5" stop-color="#1A222B"/>
      <stop offset="1" stop-color="#0D1319"/>
    </linearGradient>

    <linearGradient id="containerB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F3A3E"/>
      <stop offset="0.5" stop-color="#14262A"/>
      <stop offset="1" stop-color="#0A1418"/>
    </linearGradient>

    <linearGradient id="containerC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2E28"/>
      <stop offset="0.5" stop-color="#241C19"/>
      <stop offset="1" stop-color="#120C0B"/>
    </linearGradient>

    <linearGradient id="mast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04060A"/>
      <stop offset="0.4" stop-color="#161E26"/>
      <stop offset="0.66" stop-color="#26303A"/>
      <stop offset="1" stop-color="#04060A"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0.34" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.8"/>
    </radialGradient>

    <filter id="soften" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="softenHard" x="-16%" y="-16%" width="132%" height="132%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="23" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- SKY -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- faint dock light haze on the horizon -->
  <rect x="0" y="300" width="1920" height="180" fill="#2C3A48" opacity="0.14" filter="url(#softenHard)"/>

  <!-- DISTANT GANTRY CRANES, structural, top edge -->
  <g stroke="#0B1017" stroke-width="8" fill="none" stroke-linecap="square">
    <path d="M150 330 L150 236 L186 236 L186 330"/>
    <path d="M96 244 L268 244"/>
    <path d="M150 244 L150 214"/>
    <path d="M186 244 L186 214"/>
    <path d="M700 336 L700 250 L732 250 L732 336"/>
    <path d="M654 258 L790 258"/>
    <path d="M700 258 L700 230"/>
    <path d="M732 258 L732 230"/>
    <path d="M1440 340 L1440 256 L1472 256 L1472 340"/>
    <path d="M1394 264 L1530 264"/>
    <path d="M1440 264 L1440 236"/>
  </g>
  <g stroke="#0B1017" stroke-width="4" fill="none" opacity="0.8">
    <path d="M118 258 L150 236"/><path d="M186 236 L236 258"/>
    <path d="M672 258 L700 240"/><path d="M732 240 L772 258"/>
  </g>

  <!-- SECURITY MAST, upper left, hard flood -->
  <g>
    <rect x="330" y="196" width="14" height="470" fill="url(#mast)"/>
    <path d="M300 196 L374 196 L364 178 L310 178 Z" fill="#0A0F15"/>
    <rect x="310" y="168" width="54" height="11" rx="2" fill="#38434E"/>
    <ellipse cx="337" cy="200" rx="190" ry="120" fill="url(#floodCool)"/>
    <ellipse cx="337" cy="194" rx="34" ry="13" fill="#EAF4FA" opacity="0.9"/>
    <!-- visible light cone -->
    <path d="M337 200 L120 700 L560 700 Z" fill="url(#floodCone)" filter="url(#soften)"/>
  </g>

  <!-- SECOND MAST, warm, mid-right, for separation and warmth -->
  <g>
    <rect x="1560" y="300" width="11" height="380" fill="url(#mast)"/>
    <path d="M1536 300 L1596 300 L1588 286 L1544 286 Z" fill="#0A0F15"/>
    <ellipse cx="1566" cy="304" rx="170" ry="104" fill="url(#floodWarm)"/>
    <ellipse cx="1566" cy="298" rx="26" ry="10" fill="#FFE2B8" opacity="0.85"/>
  </g>

  <!-- CONTAINER ROWS, receding right-to-left, geometric and ordered -->
  <!-- far row -->
  <g>
    <rect x="420" y="566" width="150" height="64" fill="url(#containerA)"/>
    <rect x="574" y="566" width="150" height="64" fill="url(#containerB)"/>
    <rect x="728" y="566" width="150" height="64" fill="url(#containerA)"/>
    <rect x="882" y="566" width="150" height="64" fill="url(#containerC)"/>
    <rect x="1036" y="566" width="150" height="64" fill="url(#containerB)"/>
    <rect x="1190" y="566" width="150" height="64" fill="url(#containerA)"/>
    <rect x="1344" y="566" width="150" height="64" fill="url(#containerA)"/>
    <rect x="420" y="500" width="150" height="64" fill="url(#containerB)"/>
    <rect x="574" y="500" width="150" height="64" fill="url(#containerA)"/>
    <rect x="882" y="500" width="150" height="64" fill="url(#containerA)"/>
    <rect x="1190" y="500" width="150" height="64" fill="url(#containerC)"/>
  </g>
  <!-- mid row, larger, closer -->
  <g>
    <rect x="1460" y="556" width="210" height="112" fill="url(#containerB)"/>
    <rect x="1674" y="556" width="210" height="112" fill="url(#containerA)"/>
    <rect x="1460" y="440" width="210" height="114" fill="url(#containerA)"/>
    <rect x="1674" y="452" width="210" height="102" fill="url(#containerC)"/>
    <!-- rim light on the top edges, from the mast -->
    <rect x="1460" y="440" width="210" height="3" fill="#9FC4D8" opacity="0.34"/>
    <rect x="1460" y="556" width="210" height="3" fill="#9FC4D8" opacity="0.22"/>
    <rect x="1674" y="452" width="210" height="3" fill="#9FC4D8" opacity="0.2"/>
    <!-- corrugation, suggested not drawn -->
    <g fill="#050A0E" opacity="0.5">
      <rect x="1490" y="470" width="2" height="80"/><rect x="1520" y="470" width="2" height="80"/>
      <rect x="1550" y="470" width="2" height="80"/><rect x="1580" y="470" width="2" height="80"/>
      <rect x="1610" y="470" width="2" height="80"/><rect x="1640" y="470" width="2" height="80"/>
    </g>
  </g>

  <!-- DEEP SHADOW BAND, mid-frame, the negative space the HUD sits on -->
  <rect x="0" y="668" width="1920" height="150" fill="#020408" opacity="0.92"/>
  <rect x="0" y="668" width="1920" height="26" fill="#020408" opacity="0.6" filter="url(#soften)"/>

  <!-- PARKED VEHICLE silhouettes between the rows -->
  <g fill="#070B10">
    <path d="M200 812 C 208 788, 232 774, 268 772 L 344 770 C 376 770, 398 782, 406 802 L 412 818 C 414 830, 406 838, 394 838 L 214 842 C 200 842, 196 828, 200 812 Z"/>
    <path d="M232 776 C 250 758, 288 750, 330 752 L 352 754 C 366 756, 374 764, 376 772 Z" fill="#0C1218"/>
    <circle cx="240" cy="840" r="18" fill="#04070B"/>
    <circle cx="392" cy="836" r="18" fill="#04070B"/>
    <!-- cold rim from the flood -->
    <path d="M232 776 C 250 758, 288 750, 330 752 L 352 754" stroke="#9FC4D8" stroke-width="2" fill="none" opacity="0.34"/>
  </g>
  <g fill="#070B10">
    <path d="M980 806 C 986 788, 1004 778, 1032 776 L 1092 774 C 1116 774, 1132 784, 1138 800 L 1142 812 C 1144 822, 1138 828, 1128 828 L 992 832 C 980 832, 976 820, 980 806 Z"/>
    <circle cx="1010" cy="830" r="15" fill="#04070B"/>
    <circle cx="1122" cy="826" r="15" fill="#04070B"/>
    <path d="M1006 780 C 1020 766, 1046 760, 1076 762 L 1092 764" stroke="#FFB35C" stroke-width="1.8" fill="none" opacity="0.26"/>
  </g>

  <!-- GROUND -->
  <path d="M0 818 L1920 818 L1920 1080 L0 1080 Z" fill="url(#ground)"/>

  <!-- hard light pools on wet concrete, directly under their masts -->
  <ellipse cx="337" cy="900" rx="330" ry="120" fill="url(#floodCool)" opacity="0.42"/>
  <ellipse cx="1566" cy="960" rx="300" ry="110" fill="url(#floodWarm)" opacity="0.3"/>

  <!-- reflected wet streaks, vertical, under the masts -->
  <g filter="url(#soften)" opacity="0.34">
    <rect x="322" y="828" width="30" height="230" fill="#CFE6F2" opacity="0.3"/>
    <rect x="1552" y="828" width="28" height="220" fill="#FFC98A" opacity="0.32"/>
  </g>

  <!-- painted bay lines, receding, the port's geometry -->
  <g stroke="#8FA8B8" stroke-width="3" opacity="0.14">
    <path d="M420 850 L560 1080"/>
    <path d="M900 850 L900 1080"/>
    <path d="M1380 850 L1260 1080"/>
  </g>

  <!-- FOREGROUND: CCTV camera on a pole, blocking the frame edge -->
  <g>
    <rect x="92" y="700" width="16" height="380" fill="url(#mast)"/>
    <rect x="76" y="694" width="48" height="12" rx="3" fill="#121A22"/>
    <!-- camera body, angled down-left, reading the scene -->
    <path d="M60 660 L188 668 L188 706 L60 700 Z" fill="#0A0F15"/>
    <path d="M60 660 L188 668 L188 674 L60 666 Z" fill="#2A343E" opacity="0.6"/>
    <circle cx="80" cy="682" r="14" fill="#05080C"/>
    <circle cx="80" cy="682" r="6" fill="#5A7A8C" opacity="0.5"/>
    <path d="M150 706 L150 730 L176 730" stroke="#0A0F15" stroke-width="7" fill="none"/>
    <!-- status LED: the only saturated cold point -->
    <circle cx="176" cy="664" r="3" fill="#55D8E8" opacity="0.9"/>
    <circle cx="176" cy="664" r="9" fill="#55D8E8" opacity="0.16" filter="url(#soften)"/>
  </g>

  <!-- foreground right: corner of a container, frame depth -->
  <g>
    <rect x="1794" y="880" width="126" height="200" fill="#0A0E13"/>
    <rect x="1794" y="880" width="126" height="4" fill="#9FC4D8" opacity="0.24"/>
    <rect x="1794" y="880" width="4" height="200" fill="#9FC4D8" opacity="0.14"/>
    <g fill="#04070B" opacity="0.6">
      <rect x="1840" y="900" width="2" height="170"/><rect x="1876" y="900" width="2" height="170"/>
    </g>
  </g>

  <!-- cold bloom over the whole frame, where the practical light is -->
  <ellipse cx="420" cy="520" rx="820" ry="300" fill="#7EA6C0" opacity="0.07" filter="url(#softenHard)"/>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:overlay"/>
</svg>
