  <!-- mast navigation lights -->
  <g>
    <circle cx="1272" cy="374" r="3" fill="#EDE8DD" opacity="0.92"/>
    <circle cx="1272" cy="374" r="10" fill="#EDE8DD" opacity="0.12"/>
    <circle cx="1456" cy="406" r="2.6" fill="#55D8E8" opacity="0.9"/>
