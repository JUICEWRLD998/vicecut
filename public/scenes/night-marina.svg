    <rect x="1690" y="408" width="4" height="6"/><rect x="1770" y="392" width="4" height="6"/>
  </g>

  <!-- rooftop aircraft beacon -->
  <circle cx="1148" cy="306" r="3.4" fill="#FF5A72" opacity="0.9"/>
  <circle cx="1148" cy="306" r="11" fill="url(#coralGlow)"/>

  <!-- WATER -->
  <rect x="0" y="520" width="1920" height="330" fill="url(#water)"/>

  <!-- city light reflections on black water -->
  <g filter="url(#reflectBlur)" opacity="0.6">
    <rect x="330" y="522" width="46" height="120" fill="#FFB35C" opacity="0.3"/>
    <rect x="514" y="522" width="34" height="150" fill="#FFC98A" opacity="0.24"/>
    <rect x="712" y="522" width="52" height="104" fill="#FFB35C" opacity="0.2"/>
    <rect x="1136" y="522" width="40" height="138" fill="#8FDCE8" opacity="0.22"/>
    <rect x="1332" y="522" width="48" height="112" fill="#FFB35C" opacity="0.18"/>
    <rect x="1554" y="522" width="36" height="132" fill="#8FDCE8" opacity="0.16"/>
    <rect x="1740" y="522" width="44" height="98" fill="#FFC98A" opacity="0.14"/>
