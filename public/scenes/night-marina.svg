    <path d="M1640 276 L1800 276"/>
    <path d="M1704 276 L1704 244 L1714 244 L1714 276"/>
    <path d="M1666 276 L1672 300"/>
  </g>

  <!-- distant window lights, warm and cyan, scattered -->
  <g fill="#FFC98A" opacity="0.75">
    <rect x="120" y="366" width="4" height="6"/><rect x="134" y="384" width="4" height="6"/>
    <rect x="160" y="366" width="4" height="6"/><rect x="176" y="398" width="4" height="6"/>
    <rect x="336" y="352" width="4" height="6"/><rect x="352" y="378" width="4" height="6"/>
    <rect x="366" y="410" width="4" height="6"/><rect x="404" y="392" width="4" height="6"/>
    <rect x="446" y="418" width="4" height="6"/><rect x="518" y="318" width="4" height="6"/>
    <rect x="532" y="352" width="4" height="6"/><rect x="548" y="398" width="4" height="6"/>
    <rect x="586" y="378" width="4" height="6"/><rect x="642" y="402" width="4" height="6"/>
    <rect x="716" y="340" width="4" height="6"/><rect x="736" y="374" width="4" height="6"/>
    <rect x="752" y="418" width="4" height="6"/><rect x="806" y="410" width="4" height="6"/>
    <rect x="870" y="432" width="4" height="6"/><rect x="922" y="362" width="4" height="6"/>
    <rect x="938" y="396" width="4" height="6"/><rect x="952" y="428" width="4" height="6"/>
    <rect x="1006" y="416" width="4" height="6"/><rect x="1064" y="440" width="4" height="6"/>
    <rect x="1142" y="334" width="4" height="6"/><rect x="1158" y="368" width="4" height="6"/>
    <rect x="1176" y="404" width="4" height="6"/><rect x="1226" y="392" width="4" height="6"/>
    <rect x="1284" y="418" width="4" height="6"/><rect x="1340" y="360" width="4" height="6"/>
    <rect x="1358" y="396" width="4" height="6"/><rect x="1436" y="422" width="4" height="6"/>
    <rect x="1488" y="444" width="4" height="6"/><rect x="1558" y="348" width="4" height="6"/>
    <rect x="1574" y="384" width="4" height="6"/><rect x="1626" y="404" width="4" height="6"/>
    <rect x="1684" y="426" width="4" height="6"/><rect x="1748" y="374" width="4" height="6"/>
    <rect x="1764" y="410" width="4" height="6"/><rect x="1838" y="420" width="4" height="6"/>
  </g>
  <g fill="#8FDCE8" opacity="0.6">
    <rect x="148" y="374" width="4" height="6"/><rect x="352" y="396" width="4" height="6"/>
    <rect x="524" y="336" width="4" height="6"/><rect x="600" y="412" width="4" height="6"/>
    <rect x="730" y="358" width="4" height="6"/><rect x="944" y="380" width="4" height="6"/>
    <rect x="1162" y="352" width="4" height="6"/><rect x="1240" y="408" width="4" height="6"/>
