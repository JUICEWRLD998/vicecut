<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Night marina at 01:42 — wet quay, moored boats, neon across black water">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070910"/>
      <stop offset="0.42" stop-color="#0E1220"/>
      <stop offset="0.72" stop-color="#1C1728"/>
      <stop offset="0.88" stop-color="#2E2030"/>
      <stop offset="1" stop-color="#3A2733"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241A2A"/>
      <stop offset="0.18" stop-color="#12131E"/>
      <stop offset="0.6" stop-color="#08090F"/>
      <stop offset="1" stop-color="#04050A"/>
    </linearGradient>

    <linearGradient id="quay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12131A"/>
      <stop offset="0.35" stop-color="#0A0B11"/>
      <stop offset="1" stop-color="#05060A"/>
    </linearGradient>

    <radialGradient id="sodium" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB35C" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FF9A3C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF8A2C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coralGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5A72" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#FF4A66" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FF3A58" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#55D8E8" stop-opacity="0.45"/>
      <stop offset="0.42" stop-color="#42C4D6" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2FA8BC" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3A4A" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#8A5A5E" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#B07A66" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="neonTube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A72" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#FF8FA0" stop-opacity="1"/>
      <stop offset="1" stop-color="#FF5A72" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="lampPost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05060A"/>
      <stop offset="0.42" stop-color="#191A22"/>
      <stop offset="0.62" stop-color="#2A2A32"/>
      <stop offset="1" stop-color="#05060A"/>
    </linearGradient>

    <linearGradient id="wetStreak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.42" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>

    <filter id="soften" x="-6%" y="-6%" width="112%" height="112%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <filter id="softenHard" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>

    <filter id="reflectBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>

