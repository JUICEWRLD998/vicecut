  <!-- pavement light pools, warm key from the right -->
  <ellipse cx="1420" cy="905" rx="430" ry="150" fill="url(#sodium)" opacity="0.5"/>
  <ellipse cx="700" cy="960" rx="360" ry="120" fill="url(#sodium)" opacity="0.26"/>
  <ellipse cx="1560" cy="840" rx="260" ry="90" fill="url(#coralGlow)" opacity="0.34"/>

  <!-- vertical wet reflections of the quay lamps -->
  <g filter="url(#soften)" opacity="0.4">
    <rect x="612" y="768" width="34" height="230" fill="#FFB35C" opacity="0.4"/>
    <rect x="1470" y="742" width="40" height="270" fill="#FFC98A" opacity="0.42"/>
    <rect x="1520" y="742" width="60" height="250" fill="#FF5A72" opacity="0.28"/>
  </g>

  <!-- LAMP POSTS, hard practical lights -->
