    <path d="M1424 516 L1420 492 L1500 488 L1532 516 Z"/>
    <path d="M1452 488 L1452 412 L1460 412 L1460 488 Z"/>
    <path d="M1600 520 L1606 500 L1660 498 L1678 520 Z"/>
