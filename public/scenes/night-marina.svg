    <circle cx="1008" cy="456" r="2.6" fill="#FFB35C" opacity="0.85"/>
    <circle cx="1008" cy="456" r="9" fill="url(#sodium)"/>
  </g>

  <!-- QUAY / DOCK PLATFORM -->
  <path d="M0 640 L1920 620 L1920 720 L0 760 Z" fill="url(#quay)"/>
  <path d="M0 640 L1920 620 L1920 628 L0 648 Z" fill="#2A2B33" opacity="0.55"/>

  <!-- quay edge bollards, receding -->
  <g fill="#0A0B11">
    <rect x="196" y="612" width="26" height="52" rx="3"/>
    <rect x="520" y="606" width="24" height="48" rx="3"/>
    <rect x="836" y="600" width="22" height="44" rx="3"/>
    <rect x="1140" y="596" width="20" height="40" rx="3"/>
    <rect x="1432" y="592" width="18" height="36" rx="3"/>
