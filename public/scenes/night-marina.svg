    <rect x="1206" y="372" width="122" height="148"/>
    <rect x="1320" y="342" width="96" height="178"/>
    <rect x="1408" y="404" width="146" height="116"/>
    <rect x="1546" y="330" width="70" height="190"/>
    <rect x="1608" y="386" width="132" height="134"/>
    <rect x="1732" y="356" width="90" height="164"/>
    <rect x="1814" y="402" width="106" height="118"/>
  </g>

