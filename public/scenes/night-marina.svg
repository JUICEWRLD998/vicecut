    <rect x="112" y="352" width="86" height="168"/>
    <rect x="190" y="410" width="140" height="110"/>
    <rect x="322" y="336" width="72" height="184"/>
    <rect x="386" y="378" width="128" height="142"/>
    <rect x="506" y="300" width="64" height="220"/>
    <rect x="562" y="360" width="150" height="160"/>
    <rect x="704" y="322" width="90" height="198"/>
    <rect x="786" y="392" width="132" height="128"/>
    <rect x="910" y="344" width="76" height="176"/>
    <rect x="978" y="398" width="160" height="122"/>
