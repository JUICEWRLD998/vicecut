    <!-- left lamp, midground -->
    <rect x="616" y="470" width="9" height="300" fill="url(#lampPost)"/>
    <path d="M600 470 L641 470 L636 458 L605 458 Z" fill="#0A0B11"/>
    <rect x="605" y="452" width="31" height="7" rx="2" fill="#3A3A44"/>
    <ellipse cx="620" cy="474" rx="120" ry="70" fill="url(#sodium)"/>
    <ellipse cx="620" cy="470" rx="26" ry="9" fill="#FFE0B0" opacity="0.85"/>

    <!-- right lamp, nearer, brighter -->
    <rect x="1470" y="420" width="12" height="380" fill="url(#lampPost)"/>
    <path d="M1450 420 L1502 420 L1496 406 L1456 406 Z" fill="#0A0B11"/>
    <rect x="1456" y="398" width="40" height="9" rx="2" fill="#43434E"/>
    <ellipse cx="1476" cy="424" rx="170" ry="96" fill="url(#sodium)"/>
    <ellipse cx="1476" cy="418" rx="34" ry="12" fill="#FFEAC8" opacity="0.9"/>
  </g>

  <!-- NEON SIGN on the quay shed, the coral accent -->
  <g>
    <path d="M1560 300 L1836 300 L1836 470 L1560 470 Z" fill="#08090E"/>
    <path d="M1560 300 L1836 300 L1836 308 L1560 308 Z" fill="#1A1B23" opacity="0.7"/>
    <ellipse cx="1700" cy="392" rx="230" ry="120" fill="url(#coralGlow)" opacity="0.5"/>
    <rect x="1592" y="356" width="216" height="6" rx="3" fill="url(#neonTube)"/>
    <rect x="1592" y="356" width="216" height="6" rx="3" fill="url(#neonTube)" filter="url(#softenHard)" opacity="0.7"/>
    <rect x="1592" y="384" width="140" height="5" rx="2.5" fill="url(#neonTube)" opacity="0.85"/>
    <rect x="1592" y="384" width="140" height="5" rx="2.5" fill="url(#neonTube)" filter="url(#softenHard)" opacity="0.55"/>
    <rect x="1592" y="408" width="176" height="4" rx="2" fill="#55D8E8" opacity="0.5"/>
    <rect x="1592" y="424" width="98" height="4" rx="2" fill="#55D8E8" opacity="0.3"/>
