<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Coastal highway at sunset — road receding to a causeway, palm silhouettes, one car backlit against the sun">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2140"/>
      <stop offset="0.26" stop-color="#4A2E44"/>
      <stop offset="0.52" stop-color="#8A4638"/>
      <stop offset="0.72" stop-color="#C4663A"/>
      <stop offset="0.86" stop-color="#E8913F"/>
      <stop offset="0.96" stop-color="#F7B45C"/>
      <stop offset="1" stop-color="#FFD08A"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7B0" stop-opacity="0.95"/>
      <stop offset="0.16" stop-color="#FFC978" stop-opacity="0.6"/>
      <stop offset="0.42" stop-color="#FF9A4E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF7A3A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hazeBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC070" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#FFB166" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#C97A4A" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A4A48"/>
      <stop offset="0.22" stop-color="#3A3131"/>
      <stop offset="0.6" stop-color="#1E1A1C"/>
      <stop offset="1" stop-color="#0D0B0D"/>
    </linearGradient>

    <linearGradient id="shoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3A2E"/>
      <stop offset="1" stop-color="#151012"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A5A52" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#3A3038"/>
      <stop offset="1" stop-color="#191418"/>
    </linearGradient>

    <radialGradient id="lensFlare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF0C8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFC070" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.76" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>

    <filter id="soften" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softenHard" x="-14%" y="-14%" width="128%" height="128%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- SKY -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- SUN, low and slightly right of centre, well above the horizon line -->
  <ellipse cx="1196" cy="726" rx="620" ry="250" fill="url(#sunGlow)"/>
  <ellipse cx="1196" cy="726" rx="74" ry="26" fill="#FFE9BE" opacity="0.92"/>
  <ellipse cx="1196" cy="726" rx="200" ry="62" fill="url(#lensFlare)" filter="url(#softenHard)"/>

  <!-- heat haze / dust band across the horizon -->
  <rect x="0" y="660" width="1920" height="160" fill="url(#hazeBand)" filter="url(#soften)"/>

  <!-- DISTANT CAUSEWAY + CITY -->
  <g fill="#3A2A34" opacity="0.9">
    <rect x="120" y="740" width="70" height="26"/>
    <rect x="232" y="734" width="44" height="32"/>
    <rect x="316" y="742" width="96" height="24"/>
    <rect x="452" y="730" width="38" height="36"/>
    <rect x="530" y="738" width="120" height="28"/>
    <rect x="690" y="746" width="82" height="20"/>
    <rect x="1360" y="740" width="88" height="26"/>
    <rect x="1500" y="732" width="52" height="34"/>
    <rect x="1600" y="742" width="110" height="24"/>
    <rect x="1750" y="736" width="64" height="30"/>
  </g>
  <!-- causeway deck, dead straight, vanishing into the haze -->
  <rect x="0" y="762" width="1920" height="7" fill="#2C2029"/>
  <g fill="#5A4048" opacity="0.5">
    <rect x="180" y="784" width="8" height="42"/><rect x="420" y="784" width="8" height="42"/>
    <rect x="660" y="784" width="8" height="42"/><rect x="1400" y="784" width="8" height="42"/>
    <rect x="1640" y="784" width="8" height="42"/>
  </g>

  <!-- WATER, left of the road -->
  <path d="M0 769 L760 769 L640 900 L0 900 Z" fill="url(#water)"/>
  <g fill="#FFD08A" opacity="0.16">
    <rect x="700" y="790" width="120" height="2"/><rect x="640" y="812" width="150" height="2"/>
    <rect x="560" y="840" width="170" height="2"/><rect x="440" y="868" width="190" height="2"/>
  </g>

  <!-- ROAD, receding to a vanishing point left of the sun -->
  <path d="M0 1080 L1920 1080 L1240 769 L880 769 Z" fill="url(#road)"/>

  <!-- verge / scrub on both shoulders -->
  <path d="M0 1080 L880 769 L760 769 L0 900 Z" fill="url(#shoulder)"/>
  <path d="M1920 1080 L1240 769 L1360 769 L1920 880 Z" fill="url(#shoulder)"/>

  <!-- lane markings, perspective-spaced -->
  <g fill="#E8C88A" opacity="0.5">
    <rect x="1044" y="775" width="10" height="5"/>
    <rect x="1036" y="800" width="14" height="8"/>
    <rect x="1024" y="840" width="22" height="12"/>
    <rect x="1006" y="900" width="34" height="18"/>
    <rect x="980" y="985" width="52" height="26"/>
    <rect x="946" y="1080" width="76" height="34" opacity="0.4"/>
  </g>
  <!-- edge line, solid, both sides -->
  <path d="M894 769 L120 1080 L188 1080 L906 769 Z" fill="#D8B888" opacity="0.28"/>
  <path d="M1236 769 L1810 1080 L1760 1080 L1222 769 Z" fill="#D8B888" opacity="0.22"/>

  <!-- CAR, low on the road, backlit to near-silhouette, slightly left of centre -->
  <g>
    <!-- long cast shadow toward the viewer -->
    <path d="M880 1000 L1120 1000 L1080 1080 L820 1080 Z" fill="#0A090B" opacity="0.6"/>
    <path d="M872
             972
             C 880 936, 905 916, 940 910
             L 1030 904
             C 1068 902, 1096 918, 1110 946
             L 1120 972
             C 1124 988, 1114 998, 1098 1000
             L 892 1004
             C 876 1004, 869 990, 872 972 Z"
          fill="#14100F"/>
    <path d="M918 912 C 936 890, 970 880, 1000 882 L 1028 884 C 1048 886, 1058 896, 1062 908 Z"
          fill="#1E1917"/>
    <!-- rear glass catching sky -->
    <path d="M924 908 C 940 892, 968 884, 996 886 L 1020 888 C 1024 894, 1022 902, 1016 906 Z"
          fill="#E8A868" opacity="0.42"/>
    <!-- wheels -->
    <circle cx="912" cy="1000" r="20" fill="#0B0A0C"/>
    <circle cx="1092" cy="996" r="20" fill="#0B0A0C"/>
    <!-- tail lights, warm-hot against the cool shadow -->
    <rect x="866" y="952" width="26" height="9" rx="3" fill="#FF5A72" opacity="0.95"/>
    <rect x="866" y="952" width="26" height="9" rx="3" fill="#FF5A72" filter="url(#softenHard)"/>
    <rect x="1108" y="948" width="24" height="8" rx="3" fill="#FF4A66" opacity="0.8"/>
    <rect x="1108" y="948" width="24" height="8" rx="3" fill="#FF5A72" filter="url(#softenHard)" opacity="0.7"/>
    <!-- rim light along the roofline, from the sun behind -->
    <path d="M918 912 C 936 890, 970 880, 1000 882 L 1028 884" stroke="#FFD9A0" stroke-width="2.4" fill="none" opacity="0.5"/>
  </g>

  <!-- PALM SILHOUETTES, foreground edges, framing the road -->
  <g fill="#120E10">
    <!-- left palm, close and large -->
    <path d="M120 1080 L138 1080 L156 700 L142 700 Z"/>
    <path d="M148 706 C 60 668, 22 592, 30 520 C 62 596, 106 654, 152 686 Z"/>
    <path d="M150 700 C 96 640, 88 556, 116 494 C 122 570, 140 638, 158 682 Z" opacity="0.92"/>
    <path d="M152 696 C 226 646, 258 574, 244 508 C 214 580, 178 640, 146 678 Z"/>
    <path d="M156 704 C 246 690, 306 640, 322 586 C 262 634, 204 668, 152 690 Z" opacity="0.88"/>
    <!-- right palm, midground -->
    <path d="M1826 1080 L1840 1080 L1852 812 L1842 812 Z"/>
    <path d="M1844 816 C 1780 792, 1750 738, 1752 686 C 1780 740, 1814 782, 1848 802 Z"/>
    <path d="M1846 812 C 1904 782, 1920 720, 1908 668 C 1892 726, 1870 774, 1844 798 Z"/>
    <path d="M1850 814 C 1794 806, 1748 772, 1734 732 C 1784 768, 1822 792, 1852 806 Z" opacity="0.9"/>
  </g>

  <!-- foreground scrub, bottom corners, depth -->
  <g fill="#0C0A0C">
    <path d="M0 1080 L0 980 C 60 992, 126 1024, 172 1080 Z"/>
    <path d="M1920 1080 L1920 996 C 1866 1006, 1806 1036, 1764 1080 Z"/>
  </g>

  <!-- sun bloom over the whole lower frame, where the practical light is -->
  <ellipse cx="1150" cy="720" rx="900" ry="200" fill="#FFB066" opacity="0.08" filter="url(#softenHard)"/>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
